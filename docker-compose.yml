name: "${COMPOSE_PROJECT_NAME:?refusing to start - COMPOSE_PROJECT_NAME is not set. The live stack sets it in .env under ~/Work/multica-docs-feature. From any other checkout use your own isolated project, e.g. docker compose -p mul-ISSUE ... , never the live one.}"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
